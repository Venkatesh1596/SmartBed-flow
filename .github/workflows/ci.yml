name: SmartBed Flow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests & Migration Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic Migrations
        working-directory: backend
        env:
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "ci_user"
          POSTGRES_PASSWORD: "ci_password"
          POSTGRES_DB: "ci_db"
          SECRET_KEY: "ci_secret_do_not_use_in_prod"
          ADMIN_PASSWORD: "ci_admin"
        run: |
          # Verify exactly one migration head
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "Error: Multiple migration heads found!"
            exit 1
          fi

      - name: Run Pytest
        working-directory: backend
        env:
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "ci_user"
          POSTGRES_PASSWORD: "ci_password"
          POSTGRES_DB: "ci_db"
          SECRET_KEY: "ci_secret_do_not_use_in_prod"
          ADMIN_PASSWORD: "ci_admin"
        run: pytest -q

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Linter
        working-directory: frontend
        run: npm run lint

      - name: Build Application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "https://api.smartbedflow.internal/api"
        run: npm run build

  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Validate docker-compose syntax
        run: docker compose config --quiet
